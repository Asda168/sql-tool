name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            bundles: nsis
          - os: macos-latest
            args: '--target universal-apple-darwin'
            bundles: dmg
          - os: ubuntu-22.04
            args: ''
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsecret-1-dev patchelf rpm

      - name: Install JS dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Build installers
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      # Give every installer a stable, URL-friendly name so the website can link to it.
      - name: Collect installers
        shell: bash
        run: |
          mkdir out
          B=desktop/src-tauri/target
          pick() { find "$B" -path '*/bundle/*' -type f -name "$1" | head -n 1; }
          case "${{ runner.os }}" in
            Windows) cp "$(pick '*-setup.exe')" "out/MySQLForgeStudio-Setup-x64.exe" ;;
            macOS)   cp "$(pick '*.dmg')" "out/MySQLForgeStudio-macOS-universal.dmg" ;;
            Linux)   cp "$(pick '*.AppImage')" out/MySQLForgeStudio.AppImage
                     cp "$(pick '*.deb')" out/MySQLForgeStudio.deb
                     cp "$(pick '*.rpm')" out/MySQLForgeStudio.rpm ;;
          esac
          cd out && shasum -a 256 * | tee "SHA256SUMS-${{ runner.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Smoke tests: really install the built packages and check the app starts and stays running.
  # Not required by `release`; check them before announcing a version.
  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-windows-latest, path: pkg }
      - name: Clean install
        shell: pwsh
        run: |
          Start-Process pkg\MySQLForgeStudio-Setup-x64.exe -ArgumentList '/S' -Wait
          $dir = Get-ChildItem "$env:LOCALAPPDATA" -Directory | Where-Object { $_.Name -like '*Forge*' } | Select-Object -First 1
          if (-not $dir) { throw "install folder not found" }
          $exe = Get-ChildItem $dir.FullName -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "app exe not found in $($dir.FullName)" }
          "APP_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: App starts and stays running
        shell: pwsh
        run: |
          Start-Process $env:APP_EXE
          Start-Sleep 15
          if (-not (Get-Process | Where-Object { $_.Path -eq $env:APP_EXE })) { throw "app exited" }
      - name: Upgrade while the app is running
        shell: pwsh
        run: |
          $p = Start-Process pkg\MySQLForgeStudio-Setup-x64.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "installer hung with the app running" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path $env:APP_EXE)) { throw "app missing after upgrade" }

  test-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-ubuntu-22.04, path: pkg }
      - name: Install .deb
        run: sudo apt-get update && sudo apt-get install -y ./pkg/MySQLForgeStudio.deb xvfb
      - name: App starts and stays running
        run: |
          BIN=$(dpkg -L mysql-forge-studio | grep '^/usr/bin/' | head -n 1)
          echo "binary: $BIN"; test -x "$BIN"
          xvfb-run -a "$BIN" > app.log 2>&1 &
          sleep 20
          pgrep -f "$BIN" || { cat app.log; echo "app exited"; exit 1; }
          pkill -f "$BIN" || true
      - name: AppImage and .rpm are valid
        run: |
          chmod +x pkg/MySQLForgeStudio.AppImage
          xvfb-run -a ./pkg/MySQLForgeStudio.AppImage --appimage-extract-and-run > appimage.log 2>&1 &
          sleep 25
          pgrep -f 'forge' || { cat appimage.log; echo "AppImage exited"; exit 1; }
          pkill -f 'forge' || true
          rpm -qip pkg/MySQLForgeStudio.rpm

  test-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-macos-latest, path: pkg }
      - name: Mount dmg and copy app
        run: |
          hdiutil attach pkg/MySQLForgeStudio-macOS-universal.dmg -nobrowse -mountpoint /Volumes/mfs
          ls /Volumes/mfs
          cp -R /Volumes/mfs/*.app /Applications/
          hdiutil detach /Volumes/mfs
          APP=$(ls -d /Applications/*Forge*.app | head -n 1); echo "$APP"
          lipo -archs "$APP"/Contents/MacOS/*
      - name: App starts and stays running
        run: |
          APP=$(ls -d /Applications/*Forge*.app | head -n 1)
          BIN=$(ls "$APP"/Contents/MacOS/* | head -n 1)
          "$BIN" > app.log 2>&1 &
          sleep 20
          pgrep -f "$APP" || { cat app.log; echo "app exited"; exit 1; }
          pkill -f "$APP" || true
